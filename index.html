<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="مخزن البرومبتات — أنشئ مسارات عمل منظمة من قوالب البرومبتات القابلة لإعادة الاستخدام" />
    <title>مخزن البرومبتات</title>
    <script>
      // يمنع وميض المظهر: يقرأ الإعدادات المخزنة ويثبّت السمة قبل الإقلاع
      (function () {
        try {
          var raw = localStorage.getItem('ps:settings');
          var theme = raw ? JSON.parse(raw).theme : null;
          var dark =
            theme === 'dark' ||
            ((theme === 'system' || !theme) &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.setAttribute('data-theme', 'dark');
        } catch (e) {
          /* تجاهل — يبقى المظهر الفاتح */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
