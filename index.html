<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="مخزن البرومبتات — أنشئ مسارات عمل منظمة من قوالب البرومبتات القابلة لإعادة الاستخدام" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233646e8'/%3E%3Cpath d='M16 7l9 4.5-9 4.5-9-4.5L16 7zm-9 9l9 4.5 9-4.5M7 20.5L16 25l9-4.5' stroke='%23fff' stroke-width='2' stroke-linejoin='round' stroke-linecap='round' fill='none'/%3E%3C/svg%3E"
    />
    <title>مخزن البرومبتات</title>
    <script>
      // يمنع وميض المظهر: يقرأ الإعدادات المخزنة ويثبّت السمة قبل الإقلاع
      (function () {
        try {
          var raw = localStorage.getItem('ps:settings');
          var theme = raw ? JSON.parse(raw).theme : null;
          var dark =
            theme === 'dark' ||
            ((theme === 'system' || !theme) &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.setAttribute('data-theme', 'dark');
        } catch (e) {
          /* تجاهل — يبقى المظهر الفاتح */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
